<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leyla'dan Sonra - Ziyaret Takip</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse"></i> Leyla'dan Sonra Ziyaret Takip
            </h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full font-medium">Anonim Sistem</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Form Kartı -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
            <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2 border-b pb-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Ziyaret Kaydı Ekle
            </h2>
            
            <form id="visitForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Anonim Öğrenci Seçimi -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ÖĞRENCİ (ANONİM)</label>
                    <select id="studentSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Öğrenci Seçiniz...</option>
                        <option value="Öğrenci #101">Öğrenci #101</option>
                        <option value="Öğrenci #102">Öğrenci #102</option>
                        <option value="Öğrenci #103">Öğrenci #103</option>
                        <option value="Öğrenci #104">Öğrenci #104</option>
                        <option value="Öğrenci #105">Öğrenci #105</option>
                    </select>
                </div>

                <!-- Kıdemli Seçimi -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">KIDEMLİ SEÇİMİ</label>
                    <select id="seniorSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Kıdemli Seçiniz...</option>
                        <option value="Kıdemli A">Kıdemli A</option>
                        <option value="Kıdemli B">Kıdemli B</option>
                        <option value="Kıdemli C">Kıdemli C</option>
                    </select>
                </div>

                <!-- Tarih ve Detay -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ZİYARET TARİHİ</label>
                    <input type="date" id="visitDate" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ZİYARET NOTU / DURUM</label>
                    <input type="text" id="visitNote" placeholder="Örn: Hediye teslim edildi" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Kaydet
                    </button>
                </div>
            </form>
        </div>

        <!-- Liste Kartı -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Ziyaret Listesi
                </h2>
                <button id="clearAllBtn" class="text-xs text-rose-600 hover:text-rose-800 font-medium border border-rose-200 hover:bg-rose-50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-trash"></i> Tüm Verileri Sil
                </button>
            </div>

            <!-- Tablo -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-xs text-slate-500 uppercase">
                        <tr>
                            <th class="p-3">Öğrenci (Anonim)</th>
                            <th class="p-3">Kıdemli</th>
                            <th class="p-3">Tarih</th>
                            <th class="p-3">Not</th>
                            <th class="p-3 text-right">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="visitList" class="divide-y divide-slate-100">
                        <!-- Dinamik Yüklenecek -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const visitForm = document.getElementById('visitForm');
            const studentSelect = document.getElementById('studentSelect');
            const seniorSelect = document.getElementById('seniorSelect');
            const visitDate = document.getElementById('visitDate');
            const visitNote = document.getElementById('visitNote');
            const visitList = document.getElementById('visitList');
            const clearAllBtn = document.getElementById('clearAllBtn');

            // Yerel depolamadan çek veya boş dizi oluştur
            let visits = JSON.parse(localStorage.getItem('ls_visits')) || [];

            // Listeyi çizme fonksiyonu
            function renderVisits() {
                visitList.innerHTML = '';
                if (visits.length === 0) {
                    visitList.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-400">Henüz kayıtlı ziyaret bulunmuyor.</td></tr>`;
                    return;
                }

                visits.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-3 font-medium text-slate-700">${item.student}</td>
                        <td class="p-3"><span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded border">${item.senior}</span></td>
                        <td class="p-3">${item.date}</td>
                        <td class="p-3">${item.note || '-'}</td>
                        <td class="p-3 text-right">
                            <button onclick="deleteVisit(${index})" class="text-slate-400 hover:text-rose-600 transition-colors">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </td>
                    `;
                    visitList.appendChild(tr);
                });
            }

            // Form Gönderimi
            visitForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!studentSelect.value || !seniorSelect.value || !visitDate.value) {
                    alert('Lütfen öğrenci, kıdemli ve tarih alanlarını doldurunuz.');
                    return;
                }

                const newVisit = {
                    student: studentSelect.value,
                    senior: seniorSelect.value,
                    date: visitDate.value,
                    note: visitNote.value
                };

                visits.push(newVisit);
                localStorage.setItem('ls_visits', JSON.stringify(visits));
                renderVisits();
                visitForm.reset();
            });

            // Tekli Silme
            window.deleteVisit = function(index) {
                visits.splice(index, 1);
                localStorage.setItem('ls_visits', JSON.stringify(visits));
                renderVisits();
            };

            // Tümünü Temizleme (Kıdemli ve Öğrenci Tüm Ziyaret Verileri)
            clearAllBtn.addEventListener('click', () => {
                if (confirm('Tüm kayıtlı ziyaret verilerini (öğrenci ve kıdemli kayıtlarını) silmek istediğinize emin misiniz?')) {
                    visits = [];
                    localStorage.removeItem('ls_visits');
                    renderVisits();
                }
            });

            // İlk Yükleme
            renderVisits();
        });
    </script>
</body>
</html>
